name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # devDependencies: esbuild (assembly-only bundler) is required to mount
      - run: npm ci

      - name: Assemble site
        run: |
          npm run build
          du -sh dist

      - name: Set router base path for Pages
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}"
          jq --arg base "$BASE" '.config["pey.router"].basePath = $base' \
            bootstrap.json > dist/bootstrap.json
          grep -n basePath dist/bootstrap.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
