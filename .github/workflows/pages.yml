name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # بدون jsdom و وابستگی‌های آزمون
      - run: npm ci --omit=dev

      - name: Assemble site
        run: |
          mkdir dist
          cp -r index.html bootstrap.json public src node_modules dist/
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          find dist -name '*.test.js' -delete
          find dist/node_modules \( -name '*.map' -o -name '*.md' -o -name '*.ts' \) -delete
          du -sh dist

      - name: Set router base path for Pages
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}"
          jq --arg base "$BASE" '.config["pey.router"].basePath = $base' \
            bootstrap.json > dist/bootstrap.json
          grep -n basePath dist/bootstrap.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
